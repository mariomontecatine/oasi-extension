<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Bloqueador de webs</title>
  <link rel="icon" href="icons/icon32.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <header class="masthead">
      <img src="icons/icon48.png" width="40" height="40" alt="">
      <div>
        <h1>Bloqueador de webs</h1>
        <p>Elige qué webs bloquear, a qué horas y qué días.</p>
      </div>
    </header>

    <div id="lists"></div>

    <div id="empty" class="empty" hidden>
      <strong>Todavía no tienes ninguna lista</strong>
      Crea una, ponle nombre y añade las webs que quieras bloquear.
    </div>

    <button type="button" id="add-list" class="add-list">+ Nueva lista</button>
  </main>

  <div id="saved" class="toast" role="status">Guardado</div>

  <template id="list-template">
    <section class="card">
      <div class="card-head">
        <input class="name" type="text" placeholder="Nombre de la lista" maxlength="40" aria-label="Nombre de la lista">
        <label class="switch" title="Activar o pausar la lista">
          <input type="checkbox" class="enabled" aria-label="Lista activa">
          <span></span>
        </label>
        <button type="button" class="icon-btn delete" title="Eliminar lista" aria-label="Eliminar lista">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>
          </svg>
        </button>
      </div>
      <p class="status"></p>

      <div class="card-body">
        <div class="field">
          <span class="field-label">Webs</span>
          <div class="sites">
            <ul class="chips"></ul>
            <input class="site-input" type="text" placeholder="Añade una web y pulsa Enter" aria-label="Añadir web" autocomplete="off" spellcheck="false">
          </div>
          <p class="site-error" hidden>Eso no parece una web. Prueba con algo como «chess.com».</p>
        </div>

        <div class="field">
          <span class="field-label">Días</span>
          <div class="days-row">
            <div class="days"></div>
            <div class="presets">
              <button type="button" class="preset" data-preset="all">Todos</button>
              <button type="button" class="preset" data-preset="weekdays">Lunes a viernes</button>
              <button type="button" class="preset" data-preset="weekend">Fin de semana</button>
            </div>
          </div>
        </div>

        <div class="field">
          <div class="hours-head">
            <span class="field-label">Horas</span>
            <label class="inline-switch">
              Todo el día
              <span class="switch"><input type="checkbox" class="all-day"><span></span></span>
            </label>
          </div>
          <div class="interval-editor">
            <div class="intervals"></div>
            <button type="button" class="link-btn add-interval">+ Añadir franja</button>
          </div>
          <div class="timeline" aria-hidden="true">
            <div class="bar">
              <div class="track"></div>
              <div class="now" title="Ahora"></div>
            </div>
            <div class="ticks">
              <span style="left: 0%">00</span>
              <span style="left: 25%">06</span>
              <span style="left: 50%">12</span>
              <span style="left: 75%">18</span>
              <span style="left: 100%">24</span>
            </div>
          </div>
        </div>
      </div>
    </section>
  </template>

  <template id="interval-template">
    <div class="interval">
      <span class="word">De</span>
      <span class="time start"></span>
      <span class="word">a</span>
      <span class="time end"></span>
      <button type="button" class="icon-btn remove" title="Quitar franja" aria-label="Quitar franja">×</button>
      <span class="note"></span>
    </div>
  </template>

  <script type="module" src="options.js"></script>
</body>
</html>
