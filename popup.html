<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Bloqueador de webs</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="popup">
  <header class="popup-head">
    <img src="icons/icon32.png" width="20" height="20" alt="">
    <strong>Bloqueador de webs</strong>
  </header>
  <ul id="lists" class="popup-lists"></ul>
  <p id="empty" class="popup-empty" hidden>Todavía no tienes ninguna lista.</p>
  <div class="popup-foot">
    <button type="button" id="open" class="btn primary">Editar listas</button>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
